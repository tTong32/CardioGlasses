<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>CardioGlasses · Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" />
  <style>
    /* Same look as the patient screen. One screen tall; only the activity log scrolls inside itself. */
    @font-face {
      font-family: "CG Digits"; font-weight: 400 500; unicode-range: U+0030-0039;
      src: local("Segoe UI"), local("SegoeUI"), local("Roboto"), local("Roboto-Regular"), local("Helvetica Neue"), local("HelveticaNeue"), local("Arial"), local("ArialMT");
    }
    @font-face {
      font-family: "CG Digits"; font-weight: 600 900; unicode-range: U+0030-0039;
      src: local("Segoe UI Semibold"), local("SegoeUI-Semibold"), local("Roboto Medium"), local("Roboto-Medium"), local("Helvetica Neue Medium"), local("HelveticaNeue-Medium"), local("Arial Bold"), local("Arial-BoldMT");
    }
    :root {
      color-scheme: light;
      --font-num: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
      --font: "CG Digits", "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --bg: #faf7f7; --surface: #ffffff; --ink: #1a1212; --ink-2: #5c4545; --ink-3: #7a6565;
      --rule: #eadfdf; --rule-strong: #d4c4c4; --accent: #c4161c; --accent-ink: #ffffff; --accent-soft: #fdecea;
      --shadow: 0 1px 2px rgba(80, 16, 16, 0.05), 0 8px 24px -12px rgba(80, 16, 16, 0.2);
      --normal: #c4161c; --normal-tint: #ffffff; --monitor: #c4161c; --monitor-tint: #fdecea;
      --notify: #a10e14; --notify-tint: #f8d4d0; --escalate: #c4161c; --escalate-tint: #f8d0cc;
      --neutral: #8a7070; --neutral-tint: #f3eeee;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.0625rem; line-height: 1.5; }
    h1, h2, p { margin: 0; }
    svg { display: block; flex: none; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .shell {
      max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
      padding: max(4px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom)); gap: clamp(8px, 1.4dvh, 12px);
    }
    .top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--font-display); font-size: 1.02rem; font-weight: 700; }
    .brand svg { color: var(--accent); }
    .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-right { display: flex; align-items: center; gap: 8px; flex: none; }
    .conn { display: inline-flex; align-items: center; gap: 7px; font-size: 0.85rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
    .conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); }
    .conn.live::before { background: var(--normal); box-shadow: 0 0 0 3px var(--normal-tint); }
    .conn.warn { color: var(--monitor); } .conn.warn::before { background: var(--monitor); }
    .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 11px; border-radius: 10px; border: 1.5px solid transparent; font-size: 0.85rem; font-weight: 700; white-space: nowrap; }
    .pill.primary { background: var(--accent); color: var(--accent-ink); }
    .pill.quiet { background: transparent; border-color: var(--rule-strong); color: var(--ink-2); }

    .card {
      --tone: var(--neutral); --tint: var(--neutral-tint);
      flex: none; padding: clamp(14px, 2.4dvh, 22px) 20px; border-radius: 16px; background: var(--tint); border: 1px solid var(--rule);
      display: grid; gap: clamp(8px, 1.4dvh, 12px); transition: background-color 0.5s ease;
    }
    .card[data-state="calm"] { --tone: var(--normal); --tint: var(--normal-tint); }
    .card[data-state="waiting"] { --tone: var(--notify); --tint: var(--notify-tint); }
    .card[data-state="urgent"] { --tone: var(--escalate); --tint: var(--escalate-tint); box-shadow: inset 0 0 0 2px var(--escalate); }
    .card[data-state="urgent"].ringing { animation: ring 1.2s ease-out infinite; }
    @keyframes ring { 0% { box-shadow: inset 0 0 0 2px var(--escalate), 0 0 0 0 color-mix(in srgb, var(--escalate) 45%, transparent); } 100% { box-shadow: inset 0 0 0 2px var(--escalate), 0 0 0 14px transparent; } }
    .who { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
    #headline { font-family: var(--font-display); font-size: clamp(1.4rem, 4dvh, 1.9rem); line-height: 1.15; font-weight: 700; color: var(--tone); text-wrap: balance; }
    .vitals { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    #hr { font-family: var(--font-num); font-size: clamp(2.2rem, 7dvh, 3.4rem); font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
    .vitals small { color: var(--ink-2); font-weight: 600; }
    #detail { color: var(--ink-2); font-size: 0.98rem; }
    .message { background: var(--surface); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
    .message .label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
    #message-text { font-size: 0.98rem; }
    #delivery { font-size: 0.85rem; font-weight: 700; }
    #delivery.ok { color: var(--normal); } #delivery.bad { color: var(--escalate); } #delivery.plain { color: var(--ink-3); }
    .big { width: 100%; min-height: 56px; border-radius: 12px; border: 0; background: var(--escalate); color: var(--surface); font-size: 1.15rem; font-weight: 800; }
    .big:active { transform: scale(0.98); }

    .log { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--rule); padding: 10px 16px 4px; }
    .log h2 { font-size: 1rem; font-weight: 700; padding-bottom: 4px; }
    #events { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
    #events li { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 0.95rem; }
    #events li:first-child { border-top: 0; }
    #events li.empty { display: block; color: var(--ink-3); }
    .e-time { color: var(--ink-3); font-size: 0.85rem; font-family: var(--font-num); font-variant-numeric: tabular-nums; padding-top: 1px; }
    .e-text b { font-weight: 700; }
    .e-via { display: block; font-size: 0.8rem; color: var(--ink-3); }
    #events li.urgent .e-text { color: var(--escalate); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-4 3 8 2-4h7"/></svg>
        <span>Family view</span>
      </div>
      <div class="top-right">
        <span class="conn" id="link" role="status">Connecting…</span>
        <button type="button" class="pill primary" id="alerts-btn" aria-pressed="false">Turn on alerts</button>
      </div>
    </header>

    <section class="card" id="card" data-state="" aria-live="assertive">
      <p class="who" id="who">Watching over</p>
      <h1 id="headline">Waiting for the glasses</h1>
      <div class="vitals"><span id="hr">—</span><small id="hr-meta">beats per minute</small></div>
      <p id="detail">You'll be alerted here if they need you.</p>
      <div class="message" id="message" hidden>
        <p class="label">Message sent to you</p>
        <p id="message-text"></p>
        <p id="delivery"></p>
      </div>
      <button type="button" class="big" id="ack" hidden>I'm on it</button>
    </section>

    <section class="log" aria-label="Activity">
      <h2>Activity</h2>
      <ul id="events"><li class="empty">Nothing yet.</li></ul>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { name: "Your family member", caregiver: "you", checkin: null, events: [], reading: null, alertsOn: false, socket: null, retryMs: 1000, deadline: 0, ringing: false };
    const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    function setLink(text, kind) { $("link").textContent = text; $("link").className = "conn" + (kind ? " " + kind : ""); }

    // ---------- Alarm (sound + vibration + speech), only after the caregiver turns alerts on ----------
    let audioCtx = null, alarmTimer = null;
    function beep() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      [0, 0.28].forEach(function (offset) {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.frequency.value = 880; osc.type = "sine";
        gain.gain.setValueAtTime(0.0001, t + offset);
        gain.gain.exponentialRampToValueAtTime(0.25, t + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + offset + 0.22);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t + offset); osc.stop(t + offset + 0.25);
      });
    }
    function startAlarm(text) {
      if (state.ringing) return;
      state.ringing = true;
      $("card").classList.add("ringing");
      if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
      if (state.alertsOn) {
        beep();
        alarmTimer = setInterval(beep, 2500);
        if ("speechSynthesis" in window && text) {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }
      }
    }
    function stopAlarm() {
      state.ringing = false;
      $("card").classList.remove("ringing");
      clearInterval(alarmTimer); alarmTimer = null;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    }
    $("alerts-btn").addEventListener("click", function () {
      state.alertsOn = !state.alertsOn;
      if (state.alertsOn) {
        try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); beep(); } catch (err) {}
      }
      $("alerts-btn").textContent = state.alertsOn ? "Alerts on" : "Turn on alerts";
      $("alerts-btn").className = "pill " + (state.alertsOn ? "quiet" : "primary");
      $("alerts-btn").setAttribute("aria-pressed", String(state.alertsOn));
    });

    // ---------- Rendering ----------
    function render() {
      const c = state.checkin, r = state.reading, name = state.name;
      $("who").textContent = "Watching over " + name;
      if (r && r.hr != null) {
        $("hr").textContent = String(Math.round(r.hr));
        const bits = ["beats per minute"];
        if (r.activity) bits.push(r.activity === "resting" ? "at rest" : r.activity);
        if (r.baseline_hr != null) bits.push("usual " + Math.round(r.baseline_hr));
        $("hr-meta").textContent = bits.join(" · ");
      } else if (r) {
        $("hr").textContent = "—";
        $("hr-meta").textContent = "weak signal from the glasses";
      }
      const card = $("card");
      const urgent = c && (c.status === "no_response" || c.status === "help") && !c.acknowledged;
      $("ack").hidden = !urgent;
      $("message").hidden = !(c && (c.status === "no_response" || c.status === "help"));
      if (!c || c.status === "resolved" || c.status === "ok") {
        card.dataset.state = r ? "calm" : "";
        $("headline").textContent = !r ? "Waiting for the glasses" : c && c.status === "ok" ? name + " said they're OK" : name + " is doing well";
        $("detail").textContent = c && c.status === "ok"
          ? "They answered the check-in at " + fmtTime(c.ended_at) + "."
          : "You'll be alerted here if " + name + " needs you.";
        stopAlarm();
      } else if (c.status === "waiting") {
        card.dataset.state = "waiting";
        $("headline").textContent = "Checking on " + name + "…";
        state.deadline = Date.now() + (c.remaining_s || 0) * 1000;
        tickCountdown();
        stopAlarm();
      } else {
        card.dataset.state = urgent ? "urgent" : "calm";
        $("headline").textContent = c.acknowledged ? "You're checking on " + name
          : c.status === "help" ? name + " asked for help" : name + " hasn't responded";
        $("detail").textContent = c.acknowledged ? "Thank you. We'll keep watching and tell you if anything changes." : "Please check on " + name + " now.";
        const event = state.events.find(function (e) { return e.kind === c.status; });
        if (event) {
          $("message-text").textContent = event.text;
          const d = $("delivery");
          if (event.channel === "imessage") { d.textContent = "Sent to your phone by iMessage ✓"; d.className = "ok"; }
          else if (event.channel === "imessage_failed") { d.textContent = "iMessage failed (" + (event.detail || "unknown error") + "). Shown here only."; d.className = "bad"; }
          else { d.textContent = "Shown on this screen (iMessage not set up)"; d.className = "plain"; }
        }
        if (urgent) startAlarm(event ? event.text.replace(/^CardioGlasses: /, "") : $("headline").textContent);
        else stopAlarm();
      }
      renderEvents();
    }
    function tickCountdown() {
      const c = state.checkin;
      if (!c || c.status !== "waiting") return;
      const left = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
      $("detail").textContent = left > 0
        ? "We asked " + state.name + " if they're OK. Waiting " + left + " s for an answer."
        : "No answer yet. Letting you know…";
    }
    setInterval(tickCountdown, 500);

    function renderEvents() {
      const list = $("events");
      list.replaceChildren();
      if (!state.events.length) {
        const li = document.createElement("li"); li.className = "empty"; li.textContent = "Nothing yet."; list.append(li); return;
      }
      for (const e of state.events) {
        const li = document.createElement("li");
        if (e.urgent) li.className = "urgent";
        const time = document.createElement("span"); time.className = "e-time"; time.textContent = fmtTime(e.t);
        const text = document.createElement("span"); text.className = "e-text"; text.textContent = e.text.replace(/^CardioGlasses: /, "");
        if (e.urgent) {
          const via = document.createElement("span"); via.className = "e-via";
          via.textContent = e.channel === "imessage" ? "Sent by iMessage" : e.channel === "imessage_failed" ? "iMessage failed" : "Shown here";
          text.append(via);
        }
        li.append(time, text);
        list.append(li);
      }
    }

    $("ack").addEventListener("click", async function () {
      stopAlarm();
      try { const res = await fetch("/checkin/ack", { method: "POST" }); if (res.ok) applySnapshot(await res.json()); } catch (err) {}
    });

    function applySnapshot(s) {
      state.name = s.patient_name || state.name;
      state.caregiver = s.caregiver_name || state.caregiver;
      state.checkin = s.current;
      state.events = s.events || [];
      render();
    }

    async function getJSON(path) { const res = await fetch(path); if (!res.ok) throw new Error(path); return res.json(); }
    async function loadInitial() {
      try { applySnapshot(await getJSON("/checkin")); } catch (err) {}
      try { const rs = await getJSON("/readings?limit=1"); if (rs.length) { state.reading = rs[0]; render(); } } catch (err) {}
    }

    function connect() {
      if (!location.host) { setLink("Example", "warn"); return demo(); }
      let socket;
      try { socket = new WebSocket((location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws"); }
      catch (err) { return reconnect(); }
      state.socket = socket;
      socket.onopen = function () { state.retryMs = 1000; setLink("Live", "live"); };
      socket.onmessage = function (event) {
        let msg; try { msg = JSON.parse(event.data); } catch (err) { return; }
        if (msg.type === "reading") { state.reading = msg.data; render(); }
        if (msg.type === "checkin") { state.checkin = msg.data; render(); }
        if (msg.type === "caregiver") { state.events.unshift(msg.data); state.events = state.events.slice(0, 50); render(); }
      };
      socket.onclose = function () { if (state.socket === socket) reconnect(); };
      socket.onerror = function () { try { socket.close(); } catch (err) {} };
    }
    function reconnect() { setLink("Reconnecting", "warn"); setTimeout(connect, state.retryMs); state.retryMs = Math.min(state.retryMs * 2, 5000); }

    // Opened as a file: show an example of the urgent state.
    function demo() {
      const now = Date.now();
      state.reading = { hr: 104, activity: "resting", baseline_hr: 68 };
      const text = "CardioGlasses: Harriet hasn't responded to a check-in. Harriet's heart rate has been around 104 bpm at rest for 48 seconds (usual 68). Harriet was asked to sit down and check their phone.";
      applySnapshot({
        patient_name: "Harriet", caregiver_name: "Alex",
        current: { id: "demo", level: "notify", status: "no_response", started_at: now - 61000, deadline: now - 1000, ended_at: now, acknowledged: false, remaining_s: 0 },
        events: [
          { t: now, kind: "no_response", text: text, channel: "screen", urgent: true },
          { t: now - 61000, kind: "started", text: "Checking on Harriet: Elevated heart rate at rest. Waiting for a reply.", channel: "screen", urgent: false }
        ]
      });
    }

    loadInitial().then(connect);
  </script>
</body>
</html>
